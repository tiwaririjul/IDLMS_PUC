<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <linearGradient id="midnightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022C43"/>
      <stop offset="100%" stop-color="#051923"/>
    </linearGradient>
  </defs>
  <rect width="160" height="220" rx="6" fill="url(#midnightBg)"/>
  <rect x="0" y="0" width="8" height="220" fill="black" opacity="0.3"/>
  
  <!-- Tiny stars -->
  <circle cx="25" cy="30" r="1.5" fill="#FDE047" opacity="0.8"/>
  <circle cx="45" cy="50" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="135" cy="35" r="1.5" fill="#FDE047" opacity="0.8"/>
  <circle cx="115" cy="65" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="30" cy="150" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="130" cy="145" r="1.2" fill="#FDE047" opacity="0.7"/>
  
  <text x="80" y="38" font-family="'Georgia', serif" font-weight="700" font-size="12" fill="#FDE047" text-anchor="middle" letter-spacing="1">THE</text>
  <text x="80" y="56" font-family="'Georgia', serif" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">MIDNIGHT</text>
  <text x="80" y="74" font-family="'Georgia', serif" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">LIBRARY</text>
  
  <!-- Stylized lit-up library building -->
  <g transform="translate(60, 95)">
    <rect x="0" y="10" width="40" height="42" rx="2" fill="#00121E" stroke="#003554" stroke-width="1.5"/>
    <polygon points="20,0 42,10 -2,10" fill="#003554"/>
    <!-- Glowing windows -->
    <rect x="6" y="15" width="8" height="10" rx="1" fill="#FDE047"/>
    <rect x="26" y="15" width="8" height="10" rx="1" fill="#FDE047"/>
    <rect x="6" y="32" width="8" height="14" rx="1" fill="#F59E0B"/>
    <rect x="26" y="32" width="8" height="14" rx="1" fill="#F59E0B"/>
  </g>
  
  <text x="80" y="185" font-family="'Georgia', serif" font-weight="600" font-size="11" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">Matt Haig</text>
</svg>

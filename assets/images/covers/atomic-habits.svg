  <text x="80" y="70" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Atomic</text>
  <text x="80" y="94" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Habits</text>
  
  <line x1="45" y1="112" x2="115" y2="112" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  
  <text x="80" y="130" font-family="'Inter', sans-serif" font-weight="500" font-size="8.5" fill="#FFE5D9" text-anchor="middle" letter-spacing="0.5">AN EASY &amp; PROVEN WAY</text>
  <text x="80" y="142" font-family="'Inter', sans-serif" font-weight="500" font-size="8.5" fill="#FFE5D9" text-anchor="middle" letter-spacing="0.5">TO BUILD GOOD HABITS</text>
  
  <text x="80" y="185" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">James Clear</text>

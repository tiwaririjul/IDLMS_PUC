<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cleanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="cyanFlare" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="220" rx="6" fill="url(#cleanBg)"/>
  <rect x="0" y="0" width="8" height="220" fill="black" opacity="0.3"/>
  <rect width="160" height="220" rx="6" fill="url(#cyanFlare)"/>
  
  <text x="80" y="45" font-family="'Courier New', monospace" font-size="7.5" fill="#38BDF8" text-anchor="middle" letter-spacing="1">A HANDBOOK OF AGILE SOFTWARE</text>
  
  <!-- Glowing circle ring -->
  <circle cx="80" cy="85" r="28" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.8"/>
  <circle cx="80" cy="85" r="32" stroke="#0284C7" stroke-width="1" stroke-dasharray="4 3" fill="none" opacity="0.6"/>
  <text x="80" y="90" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
  
  <text x="80" y="142" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Clean Code</text>
  <text x="80" y="157" font-family="'Inter', sans-serif" font-size="7.5" fill="#94A3B8" text-anchor="middle">Craftsmanship</text>
  
  <text x="80" y="195" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#E2E8F0" text-anchor="middle">Robert C. Martin</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <linearGradient id="dcCoverBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="60%" stop-color="#2D124D"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="160" height="220" rx="6" fill="url(#dcCoverBg)"/>
  <rect x="0" y="0" width="8" height="220" fill="black" opacity="0.25"/>
  <rect width="160" height="220" rx="6" fill="none" stroke="#6D28D9" stroke-width="1.2"/>
  
  <text x="80" y="30" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">DATA AND COMPUTER</text>
  <text x="80" y="44" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">COMMUNICATIONS</text>
  <text x="80" y="58" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#F59E0B" text-anchor="middle">TENTH EDITION</text>
  
  <!-- Stylized Orange Glowing Network / Fiber Grid -->
  <g transform="translate(80, 125)">
    <!-- Horizon Grid Lines -->
    <path d="M-60,35 L60,35 M-50,22 L50,22 M-40,10 L40,10 M-30,0 L30,0" stroke="#F97316" stroke-width="1" opacity="0.6"/>
    <path d="M-55,35 L-20,-15 M-35,35 L-10,-15 M0,35 L0,-15 M35,35 L10,-15 M55,35 L20,-15" stroke="#FB923C" stroke-width="1" opacity="0.5"/>
    
    <!-- Central Glowing Nodes -->
    <circle cx="0" cy="0" r="14" fill="#EA580C" opacity="0.25"/>
    <circle cx="0" cy="0" r="6" fill="url(#orangeGlow)"/>
    <line x1="-25" y1="-18" x2="0" y2="0" stroke="#FDE047" stroke-width="1.5"/>
    <line x1="25" y1="-18" x2="0" y2="0" stroke="#FDE047" stroke-width="1.5"/>
    <line x1="-30" y1="12" x2="0" y2="0" stroke="#F97316" stroke-width="1.2"/>
    <line x1="30" y1="12" x2="0" y2="0" stroke="#F97316" stroke-width="1.2"/>
    <circle cx="-25" cy="-18" r="4" fill="#FDE047"/>
    <circle cx="25" cy="-18" r="4" fill="#FDE047"/>
    <circle cx="-30" cy="12" r="3.5" fill="#FB923C"/>
    <circle cx="30" cy="12" r="3.5" fill="#FB923C"/>
  </g>
  
  <text x="80" y="195" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#E2E8F0" text-anchor="middle">William Stallings</text>
</svg>

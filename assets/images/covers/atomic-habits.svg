      <stop offset="0%" stop-color="#FF6B5B"/>
      <stop offset="100%" stop-color="#E24A3B"/>
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#FFE5D9" opacity="0.45"/>

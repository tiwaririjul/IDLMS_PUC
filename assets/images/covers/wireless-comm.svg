<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <linearGradient id="wcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <radialGradient id="wcGlow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="220" rx="6" fill="url(#wcBg)"/>
  <rect x="0" y="0" width="8" height="220" fill="black" opacity="0.3"/>
  <circle cx="80" cy="180" r="70" fill="url(#wcGlow)"/>
  
  <text x="80" y="32" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">WIRELESS</text>
  <text x="80" y="46" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#BAE6FD" text-anchor="middle" letter-spacing="0.5">COMMUNICATIONS</text>
  
  <!-- Radio wave arcs -->
  <g transform="translate(80, 140)" stroke="#E0F2FE" stroke-width="1.2" fill="none" opacity="0.85">
    <circle cx="0" cy="0" r="10" stroke-dasharray="2,2"/>
    <circle cx="0" cy="0" r="22" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="36"/>
    <circle cx="0" cy="0" r="50"/>
    <circle cx="0" cy="0" r="6" fill="#38BDF8"/>
  </g>
  
  <text x="80" y="200" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#E2E8F0" text-anchor="middle">Andrea Goldsmith</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <rect width="160" height="220" rx="6" fill="#FDFBF7"/>
  <rect x="0" y="0" width="8" height="220" fill="black" opacity="0.08"/>
  <rect width="160" height="220" rx="6" fill="none" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="80" y="32" font-family="'Georgia', serif" font-weight="700" font-size="11" fill="#404040" text-anchor="middle">THE</text>
  <text x="80" y="48" font-family="'Georgia', serif" font-weight="700" font-size="14" fill="#171717" text-anchor="middle">PRAGMATIC</text>
  <text x="80" y="64" font-family="'Georgia', serif" font-weight="700" font-size="13" fill="#171717" text-anchor="middle">PROGRAMMER</text>
  <text x="80" y="78" font-family="'Inter', sans-serif" font-weight="600" font-size="7" fill="#737373" text-anchor="middle">20th Anniversary Edition</text>
  <!-- Architectural line art / compass / blueprint -->
  <g transform="translate(80, 130)" stroke="#525252" stroke-width="1.2" fill="none">
    <circle cx="0" cy="0" r="28" stroke-dasharray="2 2"/>
    <polygon points="0,-24 20,18 -20,18"/>
    <circle cx="0" cy="0" r="5" fill="#E5E5E5"/>
    <line x1="-32" y1="0" x2="32" y2="0"/>
    <line x1="0" y1="-32" x2="0" y2="32"/>
  </g>
  <text x="80" y="196" font-family="'Georgia', serif" font-weight="600" font-size="7.5" fill="#525252" text-anchor="middle">David Thomas • Andrew Hunt</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <clipPath id="avatarCircle">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#avatarCircle)">
    <rect width="100" height="100" fill="url(#avatarBg)"/>
    <!-- Body/Shirt -->
    <path d="M50,68 C32,68 18,78 14,95 C23,100 36,102 50,102 C64,102 77,100 86,95 C82,78 68,68 50,68 Z" fill="#1E40AF"/>
    <!-- Collar -->
    <polygon points="50,75 42,68 50,83 58,68" fill="#FFFFFF"/>
    <!-- Neck -->
    <rect x="44" y="56" width="12" height="16" fill="#D49B74"/>
    <!-- Head -->
    <ellipse cx="50" cy="46" rx="20" ry="22" fill="#E8B593"/>
    <!-- Hair -->
    <path d="M28,42 C27,26 36,16 50,16 C64,16 73,26 72,42 C67,36 57,32 50,32 C43,32 33,36 28,42 Z" fill="#1F2937"/>
    <!-- Glasses -->
    <rect x="35" y="42" width="12" height="9" rx="2.5" fill="none" stroke="#1F2937" stroke-width="1.8"/>
    <rect x="53" y="42" width="12" height="9" rx="2.5" fill="none" stroke="#1F2937" stroke-width="1.8"/>
    <line x1="47" y1="46" x2="53" y2="46" stroke="#1F2937" stroke-width="1.8"/>
    <!-- Eyes -->
    <circle cx="41" cy="46.5" r="1.8" fill="#1F2937"/>
    <circle cx="59" cy="46.5" r="1.8" fill="#1F2937"/>
    <!-- Eyebrows -->
    <path d="M36,39 Q41,37 46,39" stroke="#1F2937" stroke-width="1.5" fill="none"/>
    <path d="M54,39 Q59,37 64,39" stroke="#1F2937" stroke-width="1.5" fill="none"/>
    <!-- Nose -->
    <path d="M49,49 L48,53 L52,53" stroke="#C4845E" stroke-width="1.2" fill="none"/>
    <!-- Smile -->
    <path d="M44,57 Q50,62 56,57" stroke="#9A3412" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
</svg>

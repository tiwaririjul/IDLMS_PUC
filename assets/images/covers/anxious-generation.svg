<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <radialGradient id="anxiousGlow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#B45309" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="220" rx="6" fill="#0A0F1D"/>
  <rect x="0" y="0" width="8" height="220" fill="black" opacity="0.3"/>
  <circle cx="80" cy="140" r="50" fill="url(#anxiousGlow)"/>
  
  <text x="80" y="32" font-family="'Georgia', serif" font-weight="700" font-size="11" fill="#FBBF24" text-anchor="middle" letter-spacing="1.5">THE</text>
  <text x="80" y="52" font-family="'Georgia', serif" font-weight="900" font-size="16" fill="#FDFBF7" text-anchor="middle" letter-spacing="1">ANXIOUS</text>
  <text x="80" y="70" font-family="'Georgia', serif" font-weight="900" font-size="13" fill="#FDFBF7" text-anchor="middle" letter-spacing="1">GENERATION</text>
  
  <!-- Radiating golden waves & child silhouette -->
  <g transform="translate(80, 135)">
    <circle cx="0" cy="0" r="30" stroke="#FBBF24" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="22" stroke="#FBBF24" stroke-width="1" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="14" stroke="#FDE68A" stroke-width="1.2" fill="none" opacity="0.8"/>
    <!-- Smartphone and glowing child -->
    <rect x="-3" y="2" width="6" height="10" rx="1" fill="#FFFFFF"/>
    <circle cx="0" cy="-6" r="4" fill="#0A0F1D"/>
  </g>
  
  <text x="80" y="195" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#E2E8F0" text-anchor="middle">Jonathan Haidt</text>
</svg>

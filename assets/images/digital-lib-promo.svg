<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" width="100%" height="100%">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Subtle background cloud -->
  <path d="M 60 45 C 55 35 70 25 85 28 C 95 18 115 20 122 30 C 135 30 142 42 135 52 C 140 60 130 70 120 70 L 65 70 C 50 70 45 55 60 45 Z" fill="#F1F5F9" opacity="0.8"/>
  
  <!-- Shelf -->
  <rect x="25" y="90" width="130" height="4" rx="2" fill="#E2E8F0"/>
  
  <!-- Books on shelf -->
  <!-- Book 1 (Navy Blue) -->
  <rect x="35" y="48" width="10" height="42" rx="1.5" fill="#1E3A8A"/>
  <rect x="37" y="52" width="6" height="3" fill="#3B82F6"/>
  
  <!-- Book 2 (Yellow/Amber) -->
  <rect x="47" y="42" width="11" height="48" rx="1.5" fill="#F59E0B"/>
  <line x1="49" y1="50" x2="56" y2="50" stroke="#78350F" stroke-width="1.5"/>
  <line x1="49" y1="54" x2="56" y2="54" stroke="#78350F" stroke-width="1.5"/>
  
  <!-- Book 3 (Dark Slate/Indigo) -->
  <rect x="60" y="38" width="12" height="52" rx="1.5" fill="#334155"/>
  <rect x="62" y="46" width="8" height="4" fill="#94A3B8"/>
  
  <!-- Book 4 (Teal/Emerald, slightly leaning) -->
  <g transform="rotate(8 75 90)">
    <rect x="73" y="44" width="9" height="46" rx="1.5" fill="#0D9488"/>
    <line x1="75" y1="52" x2="80" y2="52" stroke="#CCFBF1" stroke-width="1.5"/>
  </g>
  
  <!-- Potted Plant on right -->
  <g transform="translate(108, 62)">
    <!-- Pot -->
    <polygon points="6,16 22,16 19,28 9,28" fill="#F87171"/>
    <rect x="5" y="14" width="18" height="3" rx="1" fill="#EF4444"/>
    <!-- Succulent leaves -->
    <path d="M 14,14 C 10,8 6,2 9,0 C 13,0 15,7 14,14 Z" fill="#10B981"/>
    <path d="M 14,14 C 18,8 23,4 20,1 C 16,0 14,8 14,14 Z" fill="#059669"/>
    <path d="M 14,14 C 8,11 1,12 2,8 C 4,5 11,10 14,14 Z" fill="#34D399"/>
    <path d="M 14,14 C 19,12 26,13 25,9 C 23,6 17,11 14,14 Z" fill="#10B981"/>
  </g>
</svg>

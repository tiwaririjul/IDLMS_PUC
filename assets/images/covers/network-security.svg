<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <linearGradient id="nsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="nsGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="220" rx="6" fill="url(#nsBg)"/>
  <rect x="0" y="0" width="8" height="220" fill="black" opacity="0.3"/>
  <circle cx="80" cy="135" r="50" fill="url(#nsGlow)"/>
  
  <text x="80" y="30" font-family="'Inter', sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NETWORK SECURITY</text>
  <text x="80" y="44" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#38BDF8" text-anchor="middle" letter-spacing="1">ESSENTIALS</text>
  <text x="80" y="56" font-family="'Georgia', serif" font-style="italic" font-size="7" fill="#94A3B8" text-anchor="middle">Applications and Standards</text>
  
  <!-- Glowing Padlock with Network Loop -->
  <g transform="translate(80, 135)" stroke="#38BDF8" stroke-width="1.5" fill="none">
    <ellipse cx="0" cy="0" rx="36" ry="18" stroke="#0284C7" stroke-dasharray="3,3"/>
    <!-- Lock shackle -->
    <path d="M-12 -6 V-18 A12 12 0 0 1 12 -18 V-6" stroke-linecap="round"/>
    <!-- Lock body -->
    <rect x="-18" y="-6" width="36" height="26" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Keyhole -->
    <circle cx="0" cy="4" r="3" fill="#38BDF8"/>
    <path d="M-1.5 6 L-2 11 L2 11 L1.5 6 Z" fill="#38BDF8"/>
  </g>
  
  <text x="80" y="200" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#CBD5E1" text-anchor="middle">William Stallings</text>
</svg>

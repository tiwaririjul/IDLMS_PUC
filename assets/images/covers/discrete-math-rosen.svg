  <text x="20" y="44" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#93C5FD">and Its Applications</text>
  <text x="20" y="58" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#38BDF8">Eighth Edition</text>

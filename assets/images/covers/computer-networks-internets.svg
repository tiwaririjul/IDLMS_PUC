<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <linearGradient id="comerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="comerGlow" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="220" rx="6" fill="url(#comerBg)"/>
  <rect x="0" y="0" width="8" height="220" fill="black" opacity="0.3"/>
  <circle cx="80" cy="140" r="45" fill="url(#comerGlow)"/>
  
  <text x="80" y="32" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">Computer Networks</text>
  <text x="80" y="46" font-family="'Inter', sans-serif" font-weight="900" font-size="10.5" fill="#38BDF8" text-anchor="middle">and Internets</text>
  
  <text x="80" y="62" font-family="'Inter', sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">Douglas E. Comer</text>
  
  <!-- Digital Globe Wireframe -->
  <g transform="translate(80, 135)" stroke="#38BDF8" stroke-width="1.2" fill="none">
    <circle cx="0" cy="0" r="34" stroke="#0284C7" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="34" ry="12"/>
    <ellipse cx="0" cy="0" rx="14" ry="34"/>
    <line x1="-34" y1="0" x2="34" y2="0"/>
    <circle cx="12" cy="-10" r="2.5" fill="#F8FAFC"/>
    <circle cx="-16" cy="12" r="2" fill="#F8FAFC"/>
  </g>
  
  <text x="80" y="195" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#64748B" text-anchor="middle">SIXTH EDITION</text>
</svg>
